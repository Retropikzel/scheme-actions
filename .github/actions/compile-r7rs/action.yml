name: compile-r7rs
inputs:
  COMPILE_R7RS:
    description: The Scheme implementation to use
    required: true
  capy_version:
    default: "3.1.0"
  chez_version:
    default: "10.4.1"
  cyclone_version:
    default: "0.36.0"
runs:
  using: composite
  steps:
    # Chibi
    - uses: actions/cache/restore@v5
      id: chibi-restore
      with:
        path: /opt/chibi
        key: chibi

    - name: Install chibi (git head)
      shell: sh
      run: |
        mkdir -p /opt/chibi
        cd /opt/chibi
        if [ ! -d chibi-scheme ]; then
          git clone https://github.com/ashinn/chibi-scheme.git --depth=1
        fi
        cd chibi-scheme
        git pull --force
        make # assumes GNUMake
        sudo make install
        mkdir -p ~/.snow && echo "()" > ~/.snow/config.scm

    - uses: actions/cache/save@v5
      id: chibi-save
      with:
        path: /opt/chibi
        key: chibi

    # Capy
    - uses: actions/cache/restore@v5
      id: capy-restore
      with:
        path: /opt/capy
        key: capy

    - name: Install capy (env.capy_version)
      if: env.COMPILE_R7RS == 'capyscheme'
      shell: sh
      run: |
          mkdir -p /opt/capy
          cd /opt/capy
          if [ ! -f capy ]; then
            wget https://github.com/playX18/capyscheme/releases/download/v${capy_version}/capyscheme-${capy_version}-x86_64-unknown-linux-gnu.tar.gz
            tar -xf capyscheme-${VERSION}-x86_64-unknown-linux-gnu.tar.gz
          fi
          cp -r capy/${capy_version} /opt/capy
          sudo ln -sf /opt/capy/capy /usr/local/bin/capy

    - uses: actions/cache/save@v5
      id: capy-save
      with:
        path: /opt/capy
        key: capy

    # Chez
    - uses: actions/cache/restore@v5
      id: chez-restore
      with:
        path: /opt/chez
        key: chez

    - name: Install chez (env.chez_version)
      if: env.COMPILE_R7RS == 'chezscheme'
      shell: sh
      run: |
          mkdir -p /opt/chez
          cd /opt/chez
          if [ ! -d csv${chez_version} ];then
            wget https://github.com/cisco/ChezScheme/releases/download/v${chez_version}/csv${chez_version}.tar.gz
            tar -xf csv${chez_version}.tar.gz
          fi
          cd csv${chez_version}
          ./configure --prefix=/usr/local
          make
          sudo make install

    - uses: actions/cache/save@v5
      id: chez-save
      with:
        path: /opt/chez
        key: chez

    # Chicken
    - uses: actions/cache/restore@v5
      id: chicken-restore
      with:
        path: /opt/chicken
        key: chicken

    - name: Install chicken (env.chicken_version)
      if: env.COMPILE_R7RS == 'chicken'
      shell: sh
      run: |
        mkdir -p /opt/chicken
        cd /opt/chicken
        if [ ! -d chicken ]; then
          wget https://code.call-cc.org/releases/${chicken_version}/chicken-${chicken_version}.tar.gz
          tar -xf chiken-${chicken_version}
        fi
        cd chicken-${chicken_version}
        ./configure --prefix=/usr/local
        make
        sudo make install

    - uses: actions/cache/save@v5
      id: chicken-save
      with:
        path: /opt/chicken
        key: chicken

    # Cyclone
    - uses: actions/cache/restore@v5
      id: cyclone-restore
      with:
        path: /opt/cyclone
        key: cyclone

    - name: Install cyclone (env.cyclone_version)
      if: env.COMPILE_R7RS == 'cyclone'
      shell: sh
      run: |
          sudo apt-get install -y libtommath-dev libck-dev
          if [ ! -d cyclone-bootstrap ]; then
            wget https://github.com/justinethier/cyclone-bootstrap/archive/refs/tags/v${cyclone_version}.tar.gz
            tar -xf v${cyclone_version}.tar.gz
          fi
          cd cyclone-bootstrap-${cyclone_version}
          make
          sudo make install

    - uses: actions/cache/save@v5
      id: cyclone-save
      with:
        path: /opt/cyclone
        key: cyclone

    # Foment
    - uses: actions/cache/restore@v5
      id: foment-restore
      with:
        path: /opt/foment
        key: foment

    - name: Install foment (git head)
      if: env.COMPILE_R7RS == 'foment'
      shell: sh
      run: |
        if [ ! -d foment ]; then
          git clone https://github.com/leftmike/foment.git --depth=1
        fi
        cd foment/unix
        make
        sudo make install

    - uses: actions/cache/save@v5
      id: foment-save
      with:
        path: /opt/foment
        key: foment

    # Misc
    - name: Install compile-r7rs
      shell: sh
      run: |
        snow-chibi install --always-yes "(retropikzel compile-r7rs)"

    - name: Set COMPILE_R7RS environment variable
      shell: sh
      run: |
        echo "COMPILE_R7RS=${{env.COMPILE_R7RS}}" >> $GITHUB_ENV

