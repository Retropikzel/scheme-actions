name: compile-r7rs
intpus:
  COMPILE_R7RS:
    description: The Scheme implementation to use
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v5
      id: chibi-restore
      with:
        path: /opt/chibi
        key: chibi

    - name: Install chibi
      shell: sh
      run: |
        mkdir -p /opt/chibi
        cd /opt/chibi
        if [ ! -d chibi-scheme ]; then
          git clone https://github.com/ashinn/chibi-scheme.git --depth=1
        fi
        cd chibi-scheme
        git pull --force
        make # assumes GNUMake
        sudo make install
        mkdir -p ~/.snow && echo "()" > ~/.snow/config.scm

    - uses: actions/cache/save@v5
      id: chibi-save
      with:
        path: /opt/chibi
        key: chibi

    - name: Install compile-r7rs
      shell: sh
      run: |
        snow-chibi install --always-yes "(retropikzel compile-r7rs)"

    - name: Set COMPILE_R7RS environment variable
      shell: sh
      run: |
        echo "COMPILE_R7RS=${{env.COMPILE_R7RS}}" >> $GITHUB_ENV

    - uses: actions/cache/restore@v5
      id: capy-restore
      with:
        path: /opt/capy
        key: capy

    - name: Install capy
      if: env.COMPILE_R7RS == 'capyscheme'
      shell: sh
      run: |
          VERSION=3.1.0
          mkdir -p /opt/capy
          cd /opt/capy
          if [ ! -f capy ]; then
            wget https://github.com/playX18/capyscheme/releases/download/v${VERSION}/capyscheme-${VERSION}-x86_64-unknown-linux-gnu.tar.gz
            tar -xf capyscheme-${VERSION}-x86_64-unknown-linux-gnu.tar.gz
          fi
          cp -r capy/${VERSION} /opt/capy
          sudo ln -sf /opt/capy/capy /usr/local/bin/capy

    - uses: actions/cache/save@v5
      id: capy-save
      with:
        path: /opt/capy
        key: capy

    - name: Cache capy
      id: cache-capy
      uses: actions/cache@v6
      with:
        path: /opt/capy
        key: capy

    - name: Install chez
      if: env.COMPILE_R7RS == 'chezscheme'
      shell: sh
      run: |
          VERSION=10.4.1
          wget https://github.com/cisco/ChezScheme/releases/download/v${VERSION}/csv${VERSION}.tar.gz
          tar -xf csv${VERSION}.tar.gz
          cd csv${VERSION}
          ./configure --prefix=/usr/local
          make
          sudo make install
