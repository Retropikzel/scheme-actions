name: compile-r7rs
inputs:
  COMPILE_R7RS:
    description: The Scheme implementation to use
    required: true
    type: string
  capy_version:
    default: 3.1.0
    type: string
  chibi_version:
    default: head
    type: string
  chicken_version:
    default: 6.1.0
    type: string
  chez_version:
    default: 10.4.1
    type: string
  cyclone_version:
    default: 0.36.0
    type: string
  foment_version:
    default: head
    type: string
  gauche_version:
    default: 0.9.15
    type: string
  gambit_version:
    default: 4.9.8
    type: string
  guile_version:
    default: 3.0.10
    type: string
  ironscheme_version:
    default: 3.0.10
    type: string
runs:
  using: composite
  steps:
    # Chibi
    - uses: actions/cache/restore@v5
      id: chibi-restore
      with:
        path: |
          /usr/local/bin/chibi
          /usr/local/lib/chibi
          /usr/local/lib/libchibi.so.0
          /usr/local/share/chibi
        key: chibi

    - name: Install chibi (${{ inputs.chibi_version }})
      shell: sh
      run: |
        if [ ! -f /usr/local/bin/chibi-scheme ]; then
          git clone https://github.com/ashinn/chibi-scheme.git --depth=1
          cd chibi-scheme
          make -j 8 # assumes GNUMake
          sudo make -j 8 install
        fi
        mkdir -p ~/.snow && echo "()" > ~/.snow/config.scm

    - uses: actions/cache/save@v5
      id: chibi-save
      with:
        path: |
          /usr/local/bin/chibi
          /usr/local/lib/chibi
          /usr/local/lib/libchibi.so.0
          /usr/local/share/chibi
        key: chibi

    # Capy
    - uses: actions/cache/restore@v5
      if: ${{ inputs.COMPILE_R7RS  == 'capyscheme' }}
      id: capy-restore
      with:
        path: /opt/capy
        key: capy

    - name: Install capy (${{inputs.capy_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'capyscheme' }}
      shell: sh
      run: |
          mkdir -p /opt/capy
          cd /opt/capy
          if [ ! -f capy ]; then
            wget https://github.com/playX18/capyscheme/releases/download/v${{inputs.capy_version}}/capyscheme-${{inputs.capy_version}}-x86_64-unknown-linux-gnu.tar.gz
            tar -xf capyscheme-${{inputs.capy_version}}-x86_64-unknown-linux-gnu.tar.gz
          fi
          sudo ln -sf /opt/capy/${{inputs.capy_version}}/capy /usr/bin/capy

    - uses: actions/cache/save@v5
      if: ${{ inputs.COMPILE_R7RS  == 'capyscheme' }}
      id: capy-save
      with:
        path: /opt/capy
        key: capy

    # Chez
    - uses: actions/cache/restore@v5
      if: ${{ inputs.COMPILE_R7RS  == 'chezscheme' }}
      id: chez-restore
      with:
        path: /opt/chez
        key: chez

    - name: Install chez (${{inputs.chez_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'chezscheme' }}
      shell: sh
      run: |
          mkdir -p /opt/chez
          cd /opt/chez
          if [ ! -d csv${{inputs.chez_version}} ];then
            wget https://github.com/cisco/ChezScheme/releases/download/v${{inputs.chez_version}}/csv${{inputs.chez_version}}.tar.gz
            tar -xf csv${{inputs.chez_version}}.tar.gz
            cd csv${{inputs.chez_version}}
            ./configure --prefix=/usr/local --disable-x11 --disable-curses --disable-iconv
            make
          else
            cd csv${{inputs.chez_version}}
          fi
          sudo make install

    - uses: actions/cache/save@v5
      if: ${{ inputs.COMPILE_R7RS  == 'chezscheme' }}
      id: chez-save
      with:
        path: /opt/chez
        key: chez

    # Chicken
    - uses: actions/cache/restore@v5
      if: ${{ inputs.COMPILE_R7RS  == 'chicken' }}
      id: chicken-restore
      with:
        path: /opt/chicken
        key: chicken

    - name: Install chicken (${{inputs.chicken_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'chicken' }}
      shell: sh
      run: |
        mkdir -p /opt/chicken
        cd /opt/chicken
        if [ ! -d chicken-${{inputs.chicken_version}} ]; then
          wget https://code.call-cc.org/releases/${{inputs.chicken_version}}/chicken-${{inputs.chicken_version}}.tar.gz
          tar -xf chicken-${{inputs.chicken_version}}.tar.gz
          cd chicken-${{inputs.chicken_version}}
          ./configure --prefix=/usr/local
          make
        else
          cd chicken-${{inputs.chicken_version}}
        fi
        sudo make install

    - uses: actions/cache/save@v5
      if: ${{ inputs.COMPILE_R7RS  == 'chicken' }}
      id: chicken-save
      with:
        path: /opt/chicken
        key: chicken

    # Cyclone
    - uses: actions/cache/restore@v5
      if: ${{ inputs.COMPILE_R7RS  == 'cyclone' }}
      id: cyclone-restore
      with:
        path: /opt/cyclone
        key: cyclone

    - name: Install cyclone (${{inputs.cyclone_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'cyclone' }}
      shell: sh
      run: |
          mkdir -p /opt/cyclone
          cd /opt/cyclone
          sudo apt-get install -y libtommath-dev libck-dev
          if [ ! -d cyclone-bootstrap ]; then
            wget https://github.com/justinethier/cyclone-bootstrap/archive/refs/tags/v${{inputs.cyclone_version}}.tar.gz
            tar -xf v${{inputs.cyclone_version}}.tar.gz
            cd cyclone-bootstrap-${{inputs.cyclone_version}}
            make CC=gcc-14
          else
            cd cyclone-bootstrap-${{inputs.cyclone_version}}
          fi
          sudo make CC=gcc-14 install

    - uses: actions/cache/save@v5
      if: ${{ inputs.COMPILE_R7RS  == 'cyclone' }}
      id: cyclone-save
      with:
        path: /opt/cyclone
        key: cyclone

    # Foment
    - uses: actions/cache/restore@v5
      if: ${{ inputs.COMPILE_R7RS  == 'foment' }}
      id: foment-restore
      with:
        path: /opt/foment
        key: foment

    - name: Install foment (${{inputs.foment_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'foment' }}
      shell: sh
      run: |
        mkdir -p /opt/foment
        cd /opt/foment
        if [ ! -d foment ]; then
          git clone https://github.com/leftmike/foment.git --depth=1
          cd foment/unix
          make
        else
          cd foment/unix
        fi
        sudo make install

    - uses: actions/cache/save@v5
      if: ${{ inputs.COMPILE_R7RS  == 'foment' }}
      id: foment-save
      with:
        path: /opt/foment
        key: foment

    # Gauche
    - uses: actions/cache/restore@v5
      if: ${{ inputs.COMPILE_R7RS  == 'gauche' }}
      id: gauche-restore
      with:
        path: /opt/gauche
        key: gauche

    - name: Install gauche (${{inputs.gauche_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'gauche' }}
      shell: sh
      run: |
        mkdir -p /opt/gauche
        cd /opt/gauche
        if [ ! -d Gauche-${{inputs.gauche_version}} ]; then
          file_version=$(echo "${{inputs.gauche_version}}" | tr '.' '_')
          wget https://github.com/shirok/Gauche/releases/download/release${file_version}/Gauche-${{inputs.gauche_version}}.tgz
          tar -xf Gauche-${{inputs.gauche_version}}.tgz
          cd Gauche-${{inputs.gauche_version}}
          ./configure
        else
          cd Gauche-${{inputs.gauche_version}}
        fi
        make -j 8
        sudo make install

    - uses: actions/cache/save@v5
      if: ${{ inputs.COMPILE_R7RS  == 'gauche' }}
      id: gauche-save
      with:
        path: /opt/gauche
        key: gauche

    # Gambit
    - uses: actions/cache/restore@v5
      if: ${{ inputs.COMPILE_R7RS  == 'gambit' }}
      id: gambit-restore
      with:
        path: /opt/gambit
        key: gambit

    - name: Install gambit (${{inputs.gambit_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'gambit' }}
      shell: sh
      run: |
        mkdir -p /opt/gambit
        cd /opt/gambit
        file_version=$(echo "${{inputs.gambit_version}}" | tr '.' '_')
        if [ ! -d gambit-${{inputs.gambit_version}} ]; then
          wget https://gambitscheme.org/${{inputs.gambit_version}}/gambit-v${file_version}.tgz
          tar -xf gambit-v${file_version}.tgz
          cd gambit-v${file_version}
          ./configure \
            --prefix=/usr/local \
            --enable-single-host \
            --enable-march=native \
            --enable-dynamic-clib \
            --enable-trust-c-tco
          make -j 8
        else
          cd gambit-${file_version}
        fi
        sudo make install

    - uses: actions/cache/save@v5
      if: ${{ inputs.COMPILE_R7RS  == 'gambit' }}
      id: gambit-save
      with:
        path: /opt/gambit
        key: gambit

    # Guile
    - uses: actions/cache/restore@v5
      if: ${{ inputs.COMPILE_R7RS  == 'guile' }}
      id: guile-restore
      with:
        path: /opt/guile
        key: guile

    - name: Install guile (${{inputs.guile_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'guile' }}
      shell: sh
      run: |
        if [ "${{inputs.guile_version}}" = "3.0.10" ]; then
          sudo apt install -y guile-3.0
        else
          mkdir -p /opt/guile
          cd /opt/guile
          sudo apt install -y \
            libunistring-dev \
            libncurses5-dev \
            libreadline-dev \
            libltdl-dev \
            libgmp-dev \
            libgc-dev \
            libffi-dev
          file_version=$(echo "${{inputs.guile_version}}" | tr '.' '_')
          if [ ! -d gambit-${{inputs.gambit_version}} ]; then
            wget https://ftp.gnu.org/gnu/guile/guile-3.0.11.tar.gz
            tar -xf guile-${{inputs.guile_version}}.tar.gz
            cd guile-${{inputs.guile_version}}
            ./configure
            make -j 8
          else
            cd guile-${{inputs.guile_version}}
          fi
          sudo make install
        fi

    - uses: actions/cache/save@v5
      if: ${{ inputs.COMPILE_R7RS  == 'guile' }}
      id: guile-save
      with:
        path: /opt/guile
        key: guile

    # Ironscheme
    - uses: actions/cache/restore@v5
      if: ${{ inputs.COMPILE_R7RS  == 'ironscheme' }}
      id: ironscheme-restore
      with:
        path: /opt/ironscheme
        key: ironscheme

    - name: Install ironscheme (${{inputs.ironscheme_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'ironscheme' }}
      shell: sh
      run: |
        mkdir -p /opt/ironscheme
        cd /opt/ironscheme
        if [ ! -d IronScheme ]; then
          git clone git clone https://github.com/IronScheme/IronScheme.git -b 1.1.650 --recurse-submodules
          cd IronScheme/IronScheme
          sh build.sh
          sh package.sh
        else
          cd IronScheme/IronScheme
        fi
        sh nuget.sh

    - uses: actions/cache/save@v5
      if: ${{ inputs.COMPILE_R7RS  == 'ironscheme' }}
      id: ironscheme-save
      with:
        path: /opt/ironscheme
        key: ironscheme

    # Misc
    - name: Install compile-r7rs
      shell: sh
      run: snow-chibi install --always-yes "(retropikzel compile-r7rs)"
