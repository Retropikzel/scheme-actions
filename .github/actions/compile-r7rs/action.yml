name: compile-r7rs
inputs:
  COMPILE_R7RS:
    description: The Scheme implementation to use
    required: true
    type: string
  capy_version:
    default: 3.1.0
    type: string
  chibi_version:
    default: head
    type: string
  chicken_version:
    default: 6.1.0
    type: string
  chez_version:
    default: 10.4.1
    type: string
  cyclone_version:
    default: 0.36.0
    type: string
  foment_version:
    default: head
    type: string
  gauche_version:
    default: 0.9.15
    type: string
  gambit_version:
    default: 4.9.8
    type: string
  guile_version:
    default: 3.0.10
    type: string
  ironscheme_version:
    default: 3.0.10
    type: string
  kawa_version:
    default: head
    type: string
  loko_version:
    default: 0.13.0
    type: string
  meevax_version:
    default: head
    type: string
  mit_version:
    default: 12.1
    type: string
  mosh_version:
    default: 0.2.9-rc1
    type: string
  racket_version:
    default: 9.3
    type: string
  sagittarius_version:
    default: 0.9.15
    type: string
  skint_version:
    default: 0.8.5
    type: string
  stak_version:
    default: 0.12.34
    type: string
  stklos_version:
    default: 26.0
    type: string
  tr7_version:
    default: 2.0.19
    type: string
runs:
  using: composite
  steps:
    # Chibi
    - uses: actions/cache/restore@v5
      id: chibi-restore
      with:
        path: /opt/chibi
        key: chibi

    - name: Install chibi (${{ inputs.chibi_version }})
      shell: sh
      run: |
        mkdir -p /opt/chibi
        cd /opt/chibi
        if [ ! -d chibi-scheme ]; then
          git clone https://github.com/ashinn/chibi-scheme.git --depth=1
          cd chibi-scheme
          make -j 4 # assumes GNUMake
        else
          cd chibi-scheme
        fi
        sudo make -j 4 install
        mkdir -p ~/.snow && echo "()" > ~/.snow/config.scm

    - uses: actions/cache/save@v5
      id: chibi-save
      with:
        path: /opt/chibi
        key: chibi

    - uses: actions/cache/restore@v5
      id: restore
      with:
        path: /opt/${{inputs.COMPILE_R7RS}}
        key: ${{inputs.COMPILE_R7RS}}

    # Capy
    - name: Install capy (${{inputs.capy_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'capyscheme' }}
      shell: sh
      run: |
          set -eux
          mkdir -p /opt/capy
          cd /opt/capy
          ls
          if [ ! -f capy ]; then
            wget https://github.com/playX18/capyscheme/releases/download/v${{inputs.capy_version}}/capyscheme-${{inputs.capy_version}}-x86_64-unknown-linux-gnu.tar.gz
            tar -xf capyscheme-${{inputs.capy_version}}-x86_64-unknown-linux-gnu.tar.gz
          fi
          chmod +x capy
          sudo ln -sf /opt/capy/capy /bin/capy
          ls

    # Chez
    - name: Install chez (${{inputs.chez_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'chezscheme' }}
      shell: sh
      run: |
          mkdir -p /opt/chez
          cd /opt/chez
          if [ ! -d csv${{inputs.chez_version}} ];then
            wget https://github.com/cisco/ChezScheme/releases/download/v${{inputs.chez_version}}/csv${{inputs.chez_version}}.tar.gz
            tar -xf csv${{inputs.chez_version}}.tar.gz
            cd csv${{inputs.chez_version}}
            ./configure --prefix=/usr/local --disable-x11 --disable-curses --disable-iconv
            make
          else
            cd csv${{inputs.chez_version}}
          fi
          sudo make install
    # Chicken
    - name: Install chicken (${{inputs.chicken_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'chicken' }}
      shell: sh
      run: |
        mkdir -p /opt/chicken
        cd /opt/chicken
        if [ ! -d chicken-${{inputs.chicken_version}} ]; then
          wget https://code.call-cc.org/releases/${{inputs.chicken_version}}/chicken-${{inputs.chicken_version}}.tar.gz
          tar -xf chicken-${{inputs.chicken_version}}.tar.gz
          cd chicken-${{inputs.chicken_version}}
          ./configure --prefix=/usr/local
          make
        else
          cd chicken-${{inputs.chicken_version}}
        fi
        sudo make install
    # Cyclone
    - name: Install cyclone (${{inputs.cyclone_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'cyclone' }}
      shell: sh
      run: |
          mkdir -p /opt/cyclone
          cd /opt/cyclone
          sudo apt-get install -y libtommath-dev libck-dev
          if [ ! -d cyclone-bootstrap ]; then
            wget https://github.com/justinethier/cyclone-bootstrap/archive/refs/tags/v${{inputs.cyclone_version}}.tar.gz
            tar -xf v${{inputs.cyclone_version}}.tar.gz
            cd cyclone-bootstrap-${{inputs.cyclone_version}}
            make CC=gcc-14
          else
            cd cyclone-bootstrap-${{inputs.cyclone_version}}
          fi
          sudo make CC=gcc-14 install
    # Foment
    - name: Install foment (${{inputs.foment_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'foment' }}
      shell: sh
      run: |
        mkdir -p /opt/foment
        cd /opt/foment
        if [ ! -d foment ]; then
          git clone https://github.com/leftmike/foment.git --depth=1
          cd foment/unix
          make
        else
          cd foment/unix
        fi
        sudo make install
    # Gauche
    - name: Install gauche (${{inputs.gauche_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'gauche' }}
      shell: sh
      run: |
        mkdir -p /opt/gauche
        cd /opt/gauche
        if [ ! -d Gauche-${{inputs.gauche_version}} ]; then
          file_version=$(echo "${{inputs.gauche_version}}" | tr '.' '_')
          wget https://github.com/shirok/Gauche/releases/download/release${file_version}/Gauche-${{inputs.gauche_version}}.tgz
          tar -xf Gauche-${{inputs.gauche_version}}.tgz
          cd Gauche-${{inputs.gauche_version}}
          ./configure --prefix=/usr/local
          make -j 4
        else
          cd Gauche-${{inputs.gauche_version}}
        fi
        sudo make install
    # Gambit
    - name: Install gambit (${{inputs.gambit_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'gambit' }}
      shell: sh
      run: |
        mkdir -p /opt/gambit
        cd /opt/gambit
        file_version=$(echo "${{inputs.gambit_version}}" | tr '.' '_')
        if [ ! -d gambit-v${{inputs.gambit_version}} ]; then
          wget https://gambitscheme.org/${{inputs.gambit_version}}/gambit-v${file_version}.tgz
          tar -xf gambit-v${file_version}.tgz
          cd gambit-v${file_version}
          ./configure \
            --prefix=/usr/local \
            --enable-single-host \
            --enable-march=native \
            --enable-dynamic-clib \
            --enable-trust-c-tco
          make -j 4
        else
          cd gambit-v${file_version}
        fi
        sudo make install
    # Guile
    - name: Install guile (${{inputs.guile_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'guile' }}
      shell: sh
      run: |
        if [ "${{inputs.guile_version}}" = "3.0.10" ]; then
          sudo apt install -y guile-3.0
        else
          mkdir -p /opt/guile
          cd /opt/guile
          sudo apt install -y \
            libunistring-dev \
            libncurses5-dev \
            libreadline-dev \
            libltdl-dev \
            libgmp-dev \
            libgc-dev \
            libffi-dev
          file_version=$(echo "${{inputs.guile_version}}" | tr '.' '_')
          if [ ! -d guile-${{inputs.guile_version}} ]; then
            wget https://ftp.gnu.org/gnu/guile/guile-3.0.11.tar.gz
            tar -xf guile-${{inputs.guile_version}}.tar.gz
            cd guile-${{inputs.guile_version}}
            ./configure
            make -j 4
          else
            cd guile-${{inputs.guile_version}}
          fi
          sudo make install
        fi
    # Ironscheme
    - name: Install ironscheme (${{inputs.ironscheme_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'ironscheme' }}
      shell: sh
      run: |
        mkdir -p /opt/ironscheme
        cd /opt/ironscheme
        if [ ! -d IronScheme ]; then
          git clone https://github.com/IronScheme/IronScheme.git -b 1.1.650 --recurse-submodules
          cd IronScheme/IronScheme
          sh build.sh
          sh package.sh
          sh nuget.sh
        else
          cd IronScheme/IronScheme
        fi
        dotnet tool install -g IronScheme.Tool --source bin/ --prerelease --allow-downgrade

    # Kawa
    - name: Install kawa (${{inputs.kawa_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'kawa' }}
      shell: sh
      run: |
        mkdir -p /opt/kawa
        cd /opt/kawa
        if [ ! -d Kawa ]; then
          git clone https://gitlab.com/kashell/Kawa.git --depth=1
          cd Kawa
          bash autogen.sh
          ./configure --prefix=/usr/local
          make
        else
          cd Kawa
        fi
        sudo make install
    # Loko
    - name: Install loko (${{inputs.loko_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'loko' }}
      shell: sh
      run: |
        mkdir -p /opt/loko
        cd /opt/loko
        if [ ! -d loko ]; then
          wget https://scheme.fail/releases/loko-${{inputs.loko_version}}.tar.gz
          tar -xf loko-${{inputs.loko_version}}.tar.gz
          cd loko-${{inputs.loko_version}}
          make
        else
          cd loko
        fi
        sudo make install
    # Meevax
    - name: Install meevax (${{inputs.meevax_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'meevax' }}
      shell: sh
      run: |
        mkdir -p /opt/meevax
        cd /opt/meevax
        if [ ! -d meevax ]; then
          git clone https://github.com/yamacir-kit/meevax.git --branch=release-candidate #--branch=v${{inputs.meevax_version}}
          cd meevax
          CC=gcc cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local .
          make CC=clang CXX=clang++ -j 4 all
        else
          cd meevax
        fi
        sudo make CC=clang CXX=clang++ install
    # MIT-Scheme
    - name: Install mit-scheme (${{inputs.mit_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'mit-scheme' }}
      shell: sh
      run: |
        mkdir -p /opt/mit-scheme
        cd /opt/mit-scheme
        if [ ! -d mit-scheme ]; then
          sudo apt install -y mit-scheme
          wget https://ftp.gnu.org/gnu/mit-scheme/stable.pkg/${{inputs.mit_version}}/mit-scheme-${{inputs.mit_version}}.tar.gz
          tar -xf mit-scheme-${{inputs.mit_version}}.tar.gz
          cd mit-scheme-${{inputs.mit_version}}/src
          cp /usr/share/automake*/config.guess .
          ./configure
          make -j 4
        else
          cd mit-scheme-${{inputs.mit_version}}/src
        fi
        sudo make install
    # Mosh
    - name: Install mosh (${{inputs.mosh_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'mosh' }}
      shell: sh
      run: |
        mkdir -p /opt/mosh
        cd /opt/mosh
        sudo apt-get install -y libonig-dev
        if [ ! -d mosh ]; then
          wget https://github.com/higepon/mosh/releases/download/mosh-${{inputs.mosh_version}}/mosh-${{inputs.mosh_version}}.tar.gz
          tar -xf mosh-${{inputs.mosh_version}}.tar.gz
          cd mosh-${{inputs.mosh_version}}
          ./configure --prefix=/usr/local
          make -j 4
        else
          cd mosh
        fi
        sudo make install
    # Racket
    - name: Install racket (${{inputs.racket_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'racket' }}
      shell: sh
      run: |
        sudo apt install -y chezscheme
        mkdir -p /opt/racket
        cd /opt/racket
        if [ ! -d racket ]; then
          wget https://download.racket-lang.org/releases/${{inputs.racket_version}}/installers/racket-minimal-${{inputs.racket_version}}-src.tgz
          tar -xf racket-minimal-${{inputs.racket_version}}-src.tgz
          mv racket-${{inputs.racket_version}} racket
          cd racket/src
          ./configure --prefix=/usr/local --enable-scheme=/usr/bin/chezscheme --enable-csonly --disable-wpo --enable-pkgs=r6rs r7rs
          make -j 4
        else
          cd racket/src
        fi
        sudo make install
    # Sagittarius
    - name: Install sagittarius (${{inputs.sagittarius_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'sagittarius' }}
      shell: sh
      run: |
        sudo apt install -y libgc-dev libtomcrypt-dev libssl-dev libz-dev
        mkdir -p /opt/sagittarius
        cd /opt/sagittarius
        if [ ! -d  sagittarius ]; then
          wget https://github.com/ktakashi/sagittarius-scheme/releases/download/v${{inputs.sagittarius_version}}/sagittarius-${{inputs.sagittarius_version}}.tar.gz
          tar -xf sagittarius-${{inputs.sagittarius_version}}.tar.gz
          cd sagittarius-${{inputs.sagittarius_version}}
          CC=clang cmake . -DCMAKE_INSTALL_PREFIX=/usr/local
          make CC=clang
        else
          cd sagittarius
        fi
        sudo make CC=clang install
    # Skint
    - name: Install skint (${{inputs.skint_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'skint' }}
      shell: sh
      run: |
        mkdir -p /opt/skint
        cd /opt/skint
        if [ ! -d  skint ]; then
          git clone https://github.com/false-schemers/skint.git --branch=v${{inputs.skint_version}}
          cd skint
          make -j 4
        else
          cd skint
        fi
        sudo make install
    # Stak
    - name: Install stak (${{inputs.stak_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'stak' }}
      shell: sh
      run: |
        mkdir -p /opt/stak
        cd /opt/stak
        if [ ! -f stak ]; then
          wget https://github.com/raviqqe/stak/releases/download/v${{inputs.stak_version}}/stak_${{inputs.stak_version}}_linux_amd64.tar.gz
          tar -xf stak_${{inputs.stak_version}}_linux_amd64.tar.gz
        fi
        sudo cp stak stak-compile stak-interpret stak-repl /usr/local/bin/
    # Stklos
    - name: Install stklos (${{inputs.stklos_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'stklos' }}
      shell: sh
      run: |
        mkdir -p /opt/stklos
        cd /opt/stklos
        if [ ! -d stklos ]; then
          wget https://github.com/egallesio/STklos/archive/refs/tags/version-${{inputs.stklos_version}}.tar.gz
          tar -xg version-${{inputs.stklos_version}}.tar.gz
          cd STklos-version-${{inputs.stklos_version}}
          ./configure --prefix=/usr/local
          make -j 4
        else
          cd stklos
        fi
        sudo make install
    # tr7
    - name: Install tr7 (${{inputs.tr7_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'tr7' }}
      shell: sh
      run: |
        mkdir -p /opt/tr7
        cd /opt/tr7
        if [ ! -d tr7 ]; then
          git clone https://gitlab.com/jobol/tr7.git --branch=v${{inputs.tr7_version}}
          cd tr7
          make -j 4
        else
          cd tr7
        fi
        sudo make install
    # ypsilon
    - name: Install ypsilon (${{inputs.ypsilon_version}})
      if: ${{ inputs.COMPILE_R7RS  == 'ypsilon' }}
      shell: sh
      run: |
        sudo apt install -y clang-19 lld-19 clang-tools-19 libgmp-dev libffi-dev
        sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-19 50
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 50
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 50
        mkdir -p /opt/ypsilon
        cd /opt/ypsilon
        if [ ! -d ypsilon ]; then
          git clone https://github.com/fujita-y/ypsilon.git --depth 1
          cd ypsilon
          CC=clang CXX=clang++ cmake -DCMAKE_BUILD_TYPE=Release .
          CC=clang CXX=clang++ cmake --build .
        else
          cd ypsilon
        fi
        sudo CC=clang CXX=clang++ cmake --install .

    - uses: actions/cache/save@v5
      id: save
      with:
        path: /opt/${{inputs.COMPILE_R7RS}}
        key: ${{inputs.COMPILE_R7RS}}

    # Misc
    - name: Install compile-r7rs
      shell: sh
      run: snow-chibi install --always-yes "(retropikzel compile-r7rs)"
