on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  r6rs:
    runs-on: ubuntu-26.04
    continue-on-error: true
    strategy:
      matrix:
        scheme: [capyscheme, chezscheme]
    steps:
      - uses: actions/checkout@v6
      - name: Init the test environment
        uses: ./.github/actions/compile-r7rs
        with:
          COMPILE_R7RS: "${{ matrix.scheme }}"
      - name: test
        run: |
          export COMPILE_R7RS_DEBUG=1
          COMPILE_R7RS=${{ matrix.scheme }} compile-r7rs -o hello-world hello-world.sps
          ./hello-world
  r7rs:
    runs-on: ubuntu-26.04
    continue-on-error: true
    strategy:
      matrix:
        scheme: [capyscheme, chibi, chicken, cyclone, foment, gauche, gambit]
    steps:
      - uses: actions/checkout@v6
      - name: Init the test environment
        uses: ./.github/actions/compile-r7rs
        with:
          COMPILE_R7RS: "${{ matrix.scheme }}"
      - name: test
        run: |
          export COMPILE_R7RS_DEBUG=1
          export COMPILE_R7RS=${{ matrix.scheme }}
          compile-r7rs -o hello-world hello-world.scm
          ./hello-world
