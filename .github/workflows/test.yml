on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        scheme: [capy, chibi]
    steps:
      - uses: actions/checkout@v6
      - name: Install test dependencies
        uses: "./.github/actions/${{ matrix.scheme }}"
      - name: test
        run: |
          compile-r7rs -o hello-world hello-world.scm
          ./hello-world
