on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  r6rs:
    runs-on: ubuntu-26.04
    continue-on-error: true
    strategy:
      matrix:
        scheme: [capyscheme, chezscheme]
    steps:
      - uses: actions/checkout@v6
      - name: Install test dependencies
        uses: ./.github/actions/compile-r7rs
        env:
          COMPILE_R7RS: "${{ matrix.scheme }}"
      - name: test
        run: |
          export COMPILE_R7RS_DEBUG=1
          compile-r7rs -o hello-world hello-world.sps
          ./hello-world
  r7rs:
    runs-on: ubuntu-26.04
    continue-on-error: true
    strategy:
      matrix:
        scheme: [capyscheme, chibi, chicken, cyclone, foment]
    steps:
      - uses: actions/checkout@v6
      - name: Install test dependencies
        uses: ./.github/actions/compile-r7rs
        env:
          COMPILE_R7RS: "${{ matrix.scheme }}"
      - name: test
        run: |
          export COMPILE_R7RS_DEBUG=1
          echo "COMPILE_R7RS: ${COMPILE_R7RS}"
          compile-r7rs -o hello-world hello-world.scm
          ./hello-world
